      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-salmon-quail.sh
        container: qc.sty_bluesy-burgundy-hummingbird
