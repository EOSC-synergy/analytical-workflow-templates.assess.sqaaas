      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-azure-eagle.sh
        container: qc.doc_cloudy-cardinal-mandrill
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-rose-dane.sh
        container: qc.doc_snappy-auburn-angora
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-buff-jellyfish.sh
        container: qc.doc_messy-amaranth-husky
