      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-cardinal-dalmatian.sh
        container: qc.sty_nippy-buff-bonobo
  QC.Ver:
