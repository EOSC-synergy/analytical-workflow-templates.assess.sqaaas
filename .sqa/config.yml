    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates licensee:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-celadon-lionfish.sh
        container: qc.lic_cranky-teal-fly
  QC.Sty:
