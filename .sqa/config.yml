      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-aquamarine-chicken.sh
        container: qc.doc_scummy-jade-booby
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-viridian-cuttlefish.sh
        container: qc.doc_muzzy-dandelion-seahorse
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-myrtle-tzu.sh
        container: qc.doc_bluesy-vermilion-cuscus
