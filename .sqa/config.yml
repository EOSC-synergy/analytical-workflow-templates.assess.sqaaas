    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-goldenrod-devil.sh
        container: qc.acc_seedy-indigo-neanderthal
  QC.Doc:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-cerulean-albatross.sh
        container: qc.doc_breezy-beige-beaver
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.homely-cardinal-labradoodle.sh
        container: qc.doc_scaly-green-cattle
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-green-turtle.sh
        container: qc.doc_goopy-myrtle-monster
