config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates:
      branch: main
      repo: https://gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.surly-fuchsia-moose.sh
        container: qc.acc_baggy-olive-booby
  QC.Doc:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-mustard-cow.sh
        container: qc.doc_flimsy-rose-bonobo
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-chocolate-terrier.sh
        container: qc.doc_bluesy-sangria-bloodhound
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-dandelion-serval.sh
        container: qc.doc_wimpy-plum-chameleon
  QC.Lic:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-teal-panda.sh
        container: qc.lic_tacky-mustard-zebu
  QC.Sty:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-amethyst-panda.sh
        container: qc.sty_zippy-khaki-dragonfly
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.messy-copper-sponge.sh
        container: qc.sty_ready-maroon-toad
  QC.Ver:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.zippy-yellow-russel.sh
        container: qc.ver_cloudy-beige-bandicoot
timeout: 5400
