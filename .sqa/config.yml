      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-pink-ladybird.sh
        container: qc.doc_blurry-eggplant-wolfhound
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-vermilion-hippopotamus.sh
        container: qc.doc_blurry-bronze-chicken
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-magenta-woodlouse.sh
        container: qc.doc_cranky-maroon-barb
