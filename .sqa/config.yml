      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-dandelion-urchin.sh
        container: qc.sty_freaky-ultramarine-mandrill
