      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-amethyst-capuchin.sh
        container: qc.acc_ugly-tomato-uakari
  QC.Doc:
