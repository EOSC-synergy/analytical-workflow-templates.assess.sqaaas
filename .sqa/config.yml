      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-sangria-cassowary.sh
        container: qc.sty_flaky-buff-opossum
  QC.Ver:
