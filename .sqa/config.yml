      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-silver-wallaby.sh
        container: qc.doc_tacky-amaranth-schnauzer
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-salmon-opossum.sh
        container: qc.doc_frumpy-magenta-dolphin
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-black-tetra.sh
        container: qc.doc_fuzzy-gold-mastiff
