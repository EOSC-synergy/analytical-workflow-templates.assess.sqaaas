      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-tangerine-opossum.sh
        container: qc.ver_fuzzy-gold-devil
