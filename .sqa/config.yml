        - /usr/bin/env sh .sqa/script.boozy-seashell-collie.sh
        container: qc.acc_scaly-turquoise-mole
  QC.Doc:
    repos:
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-magnolia-caracal.sh
        container: qc.doc_woozy-amaranth-goat
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates git:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-denim-hyena.sh
        container: qc.doc_muzzy-lemon-coyote
      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-aquamarine-chihuahua.sh
        container: qc.doc_snappy-coral-tarantula
