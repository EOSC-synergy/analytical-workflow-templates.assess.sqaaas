      gitlab.a.incd.pt/envri-hub-next/analytical-workflow-templates get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-orchid-baboon.sh
        container: qc.ver_greasy-pear-monkey
